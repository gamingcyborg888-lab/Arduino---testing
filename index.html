<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arduino USB Web Controller</title>

  <!-- Google Web Serial Polyfill (Routes Serial through WebUSB on Android) -->
  <script src="https://cdn.jsdelivr.net/npm/web-serial-polyfill@1.0.15/dist/serial.js"></script>

  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
    h2 { margin-bottom: 5px; }
    #status { font-weight: bold; margin-bottom: 20px; color: #555; }
    button { padding: 14px 28px; font-size: 16px; margin: 10px; border-radius: 8px; border: none; cursor: pointer; }
    .connect { background-color: #007bff; color: white; }
    .on { background-color: #28a745; color: white; }
    .off { background-color: #dc3545; color: white; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>

  <h2>Arduino USB Web Controller</h2>
  <p id="status">Status: Disconnected</p>

  <button id="connectBtn" class="connect">1. Connect to Arduino</button><br><br>
  <button id="onBtn" class="on" disabled>Turn ON (Pin 13)</button>
  <button id="offBtn" class="off" disabled>Turn OFF (Pin 13)</button>

  <script>
    let port;
    let writer;

    const connectBtn = document.getElementById('connectBtn');
    const onBtn = document.getElementById('onBtn');
    const offBtn = document.getElementById('offBtn');
    const statusText = document.getElementById('status');

    connectBtn.addEventListener('click', async () => {
      try {
        let serialProvider;

        // Force WebUSB polyfill on Android to bypass broken native serial
        if (typeof serial !== 'undefined' && serial.Serial) {
          serialProvider = new serial.Serial();
        } else if ('serial' in navigator) {
          serialProvider = navigator.serial;
        } else {
          alert("WebUSB / Web Serial is not supported on this browser.");
          return;
        }

        port = await serialProvider.requestPort();
        await port.open({ baudRate: 9600 });

        const textEncoder = new TextEncoderStream();
        textEncoder.readable.pipeTo(port.writable);
        writer = textEncoder.writable.getWriter();

        statusText.innerText = "Status: Connected!";
        statusText.style.color = "green";
        onBtn.disabled = false;
        offBtn.disabled = false;
      } catch (err) {
        alert("Connection failed: " + err.message);
      }
    });

    async function sendCommand(command) {
      if (writer) {
        await writer.write(command);
      }
    }

    onBtn.addEventListener('click', () => sendCommand('1'));
    offBtn.addEventListener('click', () => sendCommand('0'));
  </script>
</body>
</html>
